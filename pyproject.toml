[project]
name = "espdlx"
version = "0.1.0"
description = "Train models in PyTorch and export them to .espdl (native format for ESP32 boards). Deploy via ONNX -> esp-dl."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Simone Salerno", email = "info@salernosimone.com" },
]
keywords = ["esp32", "esp-dl", "espdlx", "pytorch", "onnx", "embedded", "tiny-ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.5.1",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[project.optional-dependencies]
convert = [
    "esp-ppq",
    "onnx>=1.14",
    "onnxruntime>=1.19",
    "onnxscript",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["espdlx*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
